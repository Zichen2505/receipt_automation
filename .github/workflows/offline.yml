name: Offline regression and Docker build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run guarded offline suites available in a clean clone
        run: >-
          python -B scripts/offline_regression.py
          tests/test_http_receipts.py tests/test_airtable_sync.py
          tests/test_web_page.py tests/test_extractor.py
          tests/test_phase2_runner.py tests/test_phase2b.py tests/test_deployment.py
      - name: Build production image without secrets or local evidence
        run: docker build --tag receipt-agent:ci .
